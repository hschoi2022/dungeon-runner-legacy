name: grade
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Run tests (Unity 소스 그대로, Unity 없이)
        run: dotnet test ci/Game.Core.Tests.csproj --logger "console;verbosity=normal"
